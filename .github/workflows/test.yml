name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '27.2'   # the floor declared in Package-Requires
          - '28.2'
          - '29.4'
          - '30.1'
          - snapshot

    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile
        run: make compile

      - name: Behavioural suite
        run: make test

      # Without nerd-icons the two icon tests skip themselves, and skipping is
      # not passing: nothing would check that a bad icon name stays quiet
      # inside redisplay.
      - name: Dev dependencies
        run: make deps

      # Once is enough: package-lint and checkdoc judge the source, not the
      # Emacs running them, and a recent package-lint has its own ideas about
      # which Emacs it wants.
      - name: Lint
        if: matrix.emacs_version == '30.1'
        run: make lint

      # Needs a real frame: under --batch, `format-mode-line' returns "" for
      # every input, so these assertions would be vacuous.  `script' from
      # util-linux provides the pty.
      - name: Frame-dependent suite
        run: make test-tty
