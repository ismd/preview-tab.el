name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '27.2'   # the floor declared in Package-Requires
          - '28.2'
          - '29.4'
          - '30.1'
          - snapshot

    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile
        run: make compile

      - name: Behavioural suite
        run: make test

      # Needs a real frame: under --batch, `format-mode-line' returns "" for
      # every input, so these assertions would be vacuous.  `script' from
      # util-linux provides the pty.
      - name: Frame-dependent suite
        run: make test-tty
